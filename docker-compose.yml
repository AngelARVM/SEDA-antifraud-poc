version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.4
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.9.4
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  postgres:
    image: postgres:16.10
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: antifraud
      POSTGRES_PASSWORD: antifraud
      POSTGRES_DB: antifraud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api-gateway:
    build:
      context: .
      dockerfile: .docker/Dockerfile_dev
    container_name: api-gateway
    depends_on:
      - kafka
    environment:
      NODE_ENV: development
      SERVICE_NAME: api-gateway
      KAFKA_BROKER: kafka:9092
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    entrypoint: ["/app/.docker/entrypoint.dev.sh"]

  normalizer-service:
    build:
      context: .
      dockerfile: .docker/Dockerfile_dev
    container_name: normalizer-service
    depends_on:
      - kafka
    environment:
      NODE_ENV: development
      SERVICE_NAME: normalizer-service
      KAFKA_BROKER: kafka:9092
    volumes:
      - .:/app
    entrypoint: ["/app/.docker/entrypoint.dev.sh"]

  rules-engine-service:
    build:
      context: .
      dockerfile: .docker/Dockerfile_dev
    container_name: rules-engine-service
    depends_on:
      - kafka
    environment:
      NODE_ENV: development
      SERVICE_NAME: rules-engine-service
      KAFKA_BROKER: kafka:9092
    volumes:
      - .:/app
    entrypoint: ["/app/.docker/entrypoint.dev.sh"]

  ml-scoring-service:
    build:
      context: .
      dockerfile: .docker/Dockerfile_dev
    container_name: ml-scoring-service
    depends_on:
      - kafka
    environment:
      NODE_ENV: development
      SERVICE_NAME: ml-scoring-service
      KAFKA_BROKER: kafka:9092
    volumes:
      - .:/app
    entrypoint: ["/app/.docker/entrypoint.dev.sh"]

  decision-engine-service:
    build:
      context: .
      dockerfile: .docker/Dockerfile_dev
    container_name: decision-engine-service
    depends_on:
      - kafka
    environment:
      NODE_ENV: development
      SERVICE_NAME: decision-engine-service
      KAFKA_BROKER: kafka:9092
    volumes:
      - .:/app
    entrypoint: ["/app/.docker/entrypoint.dev.sh"]

  audit-service:
    build:
      context: .
      dockerfile: .docker/Dockerfile_dev
    container_name: audit-service
    depends_on:
      - kafka
      - postgres
    environment:
      NODE_ENV: development
      SERVICE_NAME: audit-service
      KAFKA_BROKER: kafka:9092
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: antifraud
      POSTGRES_PASSWORD: antifraud
      POSTGRES_DB: antifraud_db
      PORT: 3000
    ports:
      - "3001:3000"
    volumes:
      - .:/app
    entrypoint: ["/app/.docker/entrypoint.dev.sh"]

volumes:
  postgres_data:
